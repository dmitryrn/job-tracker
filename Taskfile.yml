version: "3"

tasks:
  lint:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./... 2>&1 | sed '/^go: downloading /d'"

  wsl-fix:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --fix --enable-only wsl_v5 ./... 2>&1 | sed '/^go: downloading /d'"

  vulncheck:
    cmds:
      - >-
        bash -o pipefail -c "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1 | sed '/^go: downloading /d'"
